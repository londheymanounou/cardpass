; CardPass firmware for the M5Stack Cardputer ADV (ESP32-S3, 8 MB flash, no PSRAM).
;
;   pio run                 -> .pio/build/cardputer-adv/firmware.bin   (app image)
;   python ../tools/package.py -> dist/CardPass.bin (launcher) + dist/CardPass-full.bin (M5Burner)
;
; ESP-IDF 5.5 (mbedTLS 3.6 APIs the crypto code is written for), NOT Arduino.
; Flash: power OFF, hold G0, plug USB-C, release G0, then `pio run -t upload`.
[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.mcu = esp32s3
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCARDPASS_FIRMWARE=1

; Debug build for Espressif's QEMU (docs/qemu.md): logging and panic output ON. Never ship this one.
[env:qemu]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DCARDPASS_QEMU=1
board_build.partitions = partitions.qemu.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.qemu.defaults
